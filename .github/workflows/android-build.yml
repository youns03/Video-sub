name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and upload debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find /usr/local/lib/android /opt/android-sdk -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable debug keystore
        id: debug_keystore_cache
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: subvid-debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          if [ -f debug.keystore ]; then
            echo "Using the cached debug signing key."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Save stable debug keystore
        if: steps.debug_keystore_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: subvid-debug-keystore-v1

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Remove previous APK artifacts to free storage quota
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const previous = artifacts.filter((artifact) => artifact.name === "SubVid-debug-APK");
            for (const artifact of previous) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted previous APK artifact ${artifact.id}`);
            }

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubVid-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
