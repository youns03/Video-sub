name: Deploy extractor backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger backend deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check Render deploy hook configuration
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository Actions secret RENDER_DEPLOY_HOOK_URL. Create the Render service and deploy hook, then save the hook URL in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK_URL"
